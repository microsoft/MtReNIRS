[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mtrenirs-alignment"
version = "0.1.0"
description = "MtSi1005 alignment of heterogeneous EEG and fNIRS sensor geometries."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.8",
  "matplotlib>=3.7",
  "mne>=1.6",
  "numpy>=1.24",
  "plotly>=5.20",
  "pyxdf>=1.16",
  "streamlit>=1.60",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
montage-align = "mtrenirs.alignment.cli:main"
montage-align-ui = "mtrenirs.alignment.ui:main"
mtsi1005 = "mtrenirs.alignment.cli:main"
mtsi1005-ui = "mtrenirs.alignment.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mtrenirs"]

[tool.hatch.build.targets.wheel.force-include]
"examples_opensource_fnirs/final-results" = "mtrenirs/alignment/examples/final-results"
"example_test_input" = "mtrenirs/alignment/example_test_input"

[tool.pytest.ini_options]
testpaths = ["tests"]
