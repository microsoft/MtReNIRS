[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mtrenirs-models"
version = "0.1.0"
description = "Inference and embedding extraction for the MtReNIRS fNIRS foundation model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
raw = ["mne>=1.6", "scipy>=1.10", "mtrenirs-alignment>=0.1.0"]
muse = ["mne>=1.6", "scipy>=1.10", "pyxdf>=1.16", "mtrenirs-alignment>=0.1.0"]
test = ["pytest>=8"]

[project.scripts]
mtrenirs-embed = "mtrenirs.models.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mtrenirs"]

[tool.hatch.build.targets.wheel.force-include]
"weights/mtrenirs_10s.pt" = "mtrenirs/models/weights/mtrenirs_10s.pt"

[tool.pytest.ini_options]
testpaths = ["tests"]
